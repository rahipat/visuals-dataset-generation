# Baseline C — per-object velocity regression, under the harness.
#
# READ THE LABEL CAVEAT in baselines/models/velocity.py before trusting any
# number from this. The target is Waymo's speed.x/speed.y field, which is ~72%
# near-zero on the sample we measured. evaluate() reports `skill_vs_zero`: if it
# is <= 0 the model has not beaten always-predicting-zero and the task as
# labelled is degenerate.
model: velocity

index_file: data/output/velocity_records.jsonl

batch_size: 32
num_workers: 6
val_split: 0.2
seed: 42
group_by: segment

huber_beta: 0.5
lr: 1.0e-4
epochs: 30
checkpoint_dir: baselines/checkpoints/velocity
