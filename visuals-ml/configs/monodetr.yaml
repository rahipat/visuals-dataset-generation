# MonoDETR baseline (milestone 3). Single vehicle class, Option A center-error eval.
model: monodetr

index_file: data/output/det_records.jsonl

resolution: [960, 640]   # network input W x H (preserves Waymo 1.5 aspect)
score_thresh: 0.2

batch_size: 8
num_workers: 4
val_split: 0.2
seed: 42

lr: 2.0e-4
clip_max_norm: 0.1      # MonoDETR's aleatoric depth loss needs gradient clipping
weight_decay: 1.0e-4    # decoupled (AdamW); the harness ran plain undecayed Adam
                        # before this, which let a flat LR drift the model into
                        # permanent NaN by epoch 7 of this 195-epoch run
warmup_epochs: 5        # matches vendor/monodetr/lib/helpers/trainer_helper.py's
                        # warmup_lr_scheduler (stepped for epoch < 5)
lr_drop: 125            # step decay epoch -- reasonable convention for a
                        # 195-epoch run; the original MonoDETR KITTI config
                        # wasn't part of what we vendored, so tune this if you
                        # have the paper's exact schedule
lr_drop_gamma: 0.1
epochs: 195
checkpoint_dir: baselines/checkpoints/monodetr
